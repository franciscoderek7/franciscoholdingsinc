<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FHI Tower | 460 Floors | Chrome & Mirror Glass</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;overflow:hidden;font-family:'Courier New',monospace;color:#fff}
#canvas-container{position:fixed;top:0;left:0;width:100%;height:100%;z-index:1}
.scanline{position:fixed;top:0;left:0;width:100%;height:100%;background:linear-gradient(to bottom,transparent 50%,rgba(0,255,136,0.02) 50%);background-size:100% 4px;pointer-events:none;z-index:5}
.hud{position:fixed;z-index:10;pointer-events:none}
.hud-tl{top:1rem;left:1rem}
.hud-tr{top:1rem;right:1rem;text-align:right}
.hud-bl{bottom:3.5rem;left:1rem}
.hud-br{bottom:3.5rem;right:1rem;text-align:right}
.hud-label{font-size:0.6rem;letter-spacing:3px;text-transform:uppercase;color:#888}
.hud-value{font-size:1.1rem;color:#D4AF37;text-shadow:0 0 10px rgba(212,175,55,0.5);margin-top:0.2rem}
.nav{position:fixed;top:1rem;right:1rem;z-index:20;display:flex;gap:0.5rem;flex-wrap:wrap;justify-content:flex-end;max-width:60%}
.nav a{background:rgba(0,0,0,0.7);border:1px solid #D4AF37;color:#D4AF37;padding:0.4rem 0.8rem;font-size:0.65rem;text-decoration:none;border-radius:4px;transition:all 0.3s;pointer-events:auto;white-space:nowrap}
.nav a:hover{background:rgba(212,175,55,0.2);box-shadow:0 0 15px rgba(212,175,55,0.3)}
.revenue{position:fixed;bottom:0;left:0;right:0;background:rgba(0,0,0,0.9);border-top:1px solid #D4AF37;padding:0.6rem;text-align:center;z-index:20}
.revenue a{color:#D4AF37;text-decoration:none;font-size:0.8rem;letter-spacing:1px}
</style>
</head>
<body>
<div id="canvas-container"></div>
<div class="scanline"></div>

<div class="hud hud-tl">
  <div class="hud-label">FHI Tower</div>
  <div class="hud-value">460 Floors</div>
  <div class="hud-label" style="margin-top:0.8rem">Material</div>
  <div class="hud-value" style="font-size:0.9rem">Chrome & Mirror Glass</div>
</div>

<div class="hud hud-tr">
  <div class="hud-label">Active Layers</div>
  <div class="hud-value">45 Companies</div>
  <div class="hud-label" style="margin-top:0.8rem">Architecture</div>
  <div class="hud-value" style="font-size:0.9rem">LogicFold</div>
</div>

<div class="hud hud-bl">
  <div class="hud-label">Current Floor</div>
  <div class="hud-value" id="currentFloor">421 — Phoenix Crown</div>
</div>

<div class="hud hud-br">
  <div class="hud-label">Status</div>
  <div class="hud-value" style="color:#00ff88">OPERATIONAL</div>
</div>

<div class="nav">
  <a href="dashboard.html">Command</a>
  <a href="avatar-command.html">Avatars</a>
  <a href="primedox-legal.html">Legal</a>
  <a href="voice-primedox.html">Voice</a>
</div>

<div class="revenue">
  <a href="mailto:franciscoderek7@gmail.com?subject=Purchase%20Inquiry">Contact to Purchase — franciscoderek7@gmail.com</a>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const scene=new THREE.Scene();
scene.fog=new THREE.FogExp2(0x000000,0.0015);
const camera=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,0.1,2000);
camera.position.set(0,180,300);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
renderer.toneMapping=THREE.ACESFilmicToneMapping;
document.getElementById('canvas-container').appendChild(renderer.domElement);

const totalFloors=460;
const floorHeight=0.5;
const gap=0.15;
const radius=12;
const keyFloors={1:'FHI HQ',2:'OmniAGuard',3:'CCLDR/CCC',10:'Vault Velocity',11:'MindShift',50:'CleanSwarm',100:'TechPetCage',200:'Kiaros',300:'Vigilax',400:'PrimeDox HQ',421:'Phoenix Crown',460:'Emperor Suite'};
const floors=[];

for(let i=1;i<=totalFloors;i++){
  const isKey=keyFloors[i]?true:false;
  const geo=new THREE.BoxGeometry(radius*2+(isKey?3:0),floorHeight,radius*2+(isKey?3:0));
  const mat=new THREE.MeshPhysicalMaterial({
    color:isKey?0xD4AF37:0xe8e8e8,
    metalness:1.0,
    roughness:0.02,
    clearcoat:1.0,
    clearcoatRoughness:0.02,
    transparent:true,
    opacity:isKey?0.95:0.75,
    emissive:isKey?0xD4AF37:0x111111,
    emissiveIntensity:isKey?0.5:0.05
  });
  const mesh=new THREE.Mesh(geo,mat);
  mesh.position.y=i*(floorHeight+gap);
  mesh.userData={floor:i,name:keyFloors[i]||null};
  scene.add(mesh);
  floors.push(mesh);
  if(isKey && i<totalFloors){
    const bond=new THREE.CylinderGeometry(0.2,0.2,gap*0.8,8);
    const bondMat=new THREE.MeshBasicMaterial({color:0x00ff88,transparent:true,opacity:0.4});
    const b=new THREE.Mesh(bond,bondMat);
    b.position.y=i*(floorHeight+gap)+floorHeight/2+gap/2;
    scene.add(b);
  }
}

const shaftGeo=new THREE.CylinderGeometry(0.6,0.6,totalFloors*(floorHeight+gap),16);
const shaftMat=new THREE.MeshBasicMaterial({color:0xD4AF37,transparent:true,opacity:0.15});
const shaft=new THREE.Mesh(shaftGeo,shaftMat);
shaft.position.y=totalFloors*(floorHeight+gap)/2;
scene.add(shaft);

const coreGeo=new THREE.SphereGeometry(3,32,32);
const coreMat=new THREE.MeshBasicMaterial({color:0x00ff88,transparent:true,opacity:0.2});
const core=new THREE.Mesh(coreGeo,coreMat);
core.position.y=totalFloors*(floorHeight+gap)/2;
scene.add(core);

const pGeo=new THREE.BufferGeometry();
const pCount=1000;
const pPos=new Float32Array(pCount*3);
for(let i=0;i<pCount*3;i++)pPos[i]=(Math.random()-0.5)*500;
pGeo.setAttribute('position',new THREE.BufferAttribute(pPos,3));
const pMat=new THREE.PointsMaterial({color:0xD4AF37,size:0.6,transparent:true,opacity:0.5});
scene.add(new THREE.Points(pGeo,pMat));

scene.add(new THREE.AmbientLight(0x404040,0.5));
const dl=new THREE.DirectionalLight(0xffffff,0.8);
dl.position.set(50,300,100);
scene.add(dl);
const pl=new THREE.PointLight(0xD4AF37,1,300);
pl.position.set(0,totalFloors*(floorHeight+gap)/2,0);
scene.add(pl);

const sGeo=new THREE.BufferGeometry();
const sCount=1500;
const sPos=new Float32Array(sCount*3);
for(let i=0;i<sCount*3;i++)sPos[i]=(Math.random()-0.5)*2500;
sGeo.setAttribute('position',new THREE.BufferAttribute(sPos,3));
const sMat=new THREE.PointsMaterial({color:0xffffff,size:0.4,transparent:true,opacity:0.6});
scene.add(new THREE.Points(sGeo,sMat));

let autoRotate=true;
function animate(){
  requestAnimationFrame(animate);
  if(autoRotate)scene.rotation.y+=0.0008;
  const t=Date.now()*0.001;
  core.scale.setScalar(1+Math.sin(t)*0.12);
  coreMat.opacity=0.15+Math.sin(t)*0.08;
  renderer.render(scene,camera);
}
animate();

let drag=false,px=0,py=0;
document.addEventListener('mousedown',e=>{if(e.target.tagName!=='A'){drag=true;px=e.clientX;py=e.clientY}});
document.addEventListener('mouseup',()=>drag=false);
document.addEventListener('mousemove',e=>{
  if(drag){scene.rotation.y+=(e.clientX-px)*0.005;camera.position.y-=(e.clientY-py)*0.3;px=e.clientX;py=e.clientY;}
});
document.addEventListener('wheel',e=>{camera.position.z+=e.deltaY*0.15;camera.position.z=Math.max(60,Math.min(500,camera.position.z));});
document.addEventListener('touchstart',e=>{px=e.touches[0].clientX;py=e.touches[0].clientY});
document.addEventListener('touchmove',e=>{
  scene.rotation.y+=(e.touches[0].clientX-px)*0.005;
  camera.position.y-=(e.touches[0].clientY-py)*0.3;
  px=e.touches[0].clientX;py=e.touches[0].clientY;
});

const raycaster=new THREE.Raycaster();
const mouse=new THREE.Vector2();
document.addEventListener('click',e=>{
  if(e.target.tagName==='A')return;
  mouse.x=(e.clientX/innerWidth)*2-1;
  mouse.y=-(e.clientY/innerHeight)*2+1;
  raycaster.setFromCamera(mouse,camera);
  const hits=raycaster.intersectObjects(floors);
  if(hits.length>0){
    const f=hits[0].object.userData;
    document.getElementById('currentFloor').innerText=f.floor+' — '+(f.name||'Standard Floor');
  }
});

window.addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
