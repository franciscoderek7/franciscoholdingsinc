name: Test Jekyll Build Only

on:
  push:
    branches:
      - test/exclude-drupal-jekyll
    paths:
      - '_config.yml'
      - '.github/workflows/test-jekyll.yml'
      - '*.html'
      - '*.md'
      - '*.css'
      - '*.js'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: GitHub Pages 232 compatibility build - no deployment
    runs-on: ubuntu-latest
    steps:
      - name: Check out test branch
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: Install GitHub Pages 232 environment
        run: gem install github-pages -v 232.0.0 --no-document

      - name: Verify installed versions
        run: |
          gem list '^github-pages$'
          gem list '^jekyll$'

      - name: Build site without deployment
        run: jekyll build --source . --destination _site --config _config.yml
