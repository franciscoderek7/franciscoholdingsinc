<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Holographic Dashboard — Phoenix Dominion</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{background:#050510;overflow:hidden;font-family:'Segoe UI',sans-serif}
        #canvas{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0}
        .ui-overlay{position:fixed;z-index:10;color:#e5e4e2;padding:2rem;width:100%;height:100%;pointer-events:none;display:flex;flex-direction:column;justify-content:space-between}
        .header{display:flex;justify-content:space-between;align-items:flex-start;pointer-events:auto}
        .logo{font-size:1.8rem;font-weight:900;letter-spacing:6px;background:linear-gradient(135deg,#D4AF37,#50C878);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
        .badge{font-size:0.7rem;color:#8892b0;border:1px solid rgba(212,175,55,0.2);padding:0.3rem 1rem;border-radius:20px;letter-spacing:2px;background:rgba(0,0,0,0.4);backdrop-filter:blur(10px)}
        .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:1rem;max-width:800px;pointer-events:auto;background:rgba(0,0,0,0.3);backdrop-filter:blur(20px);border:1px solid rgba(212,175,55,0.08);border-radius:16px;padding:1.5rem}
        .stat-item .label{font-size:0.6rem;color:#8892b0;letter-spacing:2px;text-transform:uppercase}
        .stat-item .value{font-size:1.5rem;font-weight:700;color:#D4AF37}
        .stat-item .value.green{color:#50C878}
        .stat-item .value.red{color:#ff4444}
        .bottom{display:flex;justify-content:space-between;align-items:flex-end;pointer-events:auto;padding-bottom:1rem}
        .chat-box{background:rgba(0,0,0,0.4);backdrop-filter:blur(20px);border:1px solid rgba(212,175,55,0.08);border-radius:12px;padding:0.8rem 1.2rem;max-width:500px;width:100%}
        .chat-box .msg{font-size:0.8rem;color:#8892b0;padding:0.2rem 0}
        .chat-box .msg .sender{font-weight:700;color:#D4AF37}
        .chat-box .msg .sender.primedox{color:#00d4ff}
        .chat-box .msg .sender.omni{color:#ff6b9d}
        .chat-box .msg .sender.soul{color:#50C878}
        .avatar-badge{display:flex;gap:1rem;pointer-events:auto}
        .avatar-badge .av{width:50px;height:50px;border-radius:50%;border:2px solid rgba(212,175,55,0.2);background:rgba(0,0,0,0.3);backdrop-filter:blur(10px);display:flex;align-items:center;justify-content:center;font-size:1.5rem;transition:0.3s}
        .avatar-badge .av:hover{border-color:#D4AF37;transform:scale(1.05)}
        @media(max-width:768px){.stats{grid-template-columns:1fr 1fr}.header{flex-direction:column;gap:1rem}.bottom{flex-direction:column;align-items:stretch;gap:1rem}}
    </style>
</head>
<body>
<div id="canvas"></div>
<div class="ui-overlay">
    <div class="header">
        <div class="logo">🏛️ FHI<span style="color:#50C878;">.</span></div>
        <div class="badge">🦅 460 FLOORS · 45 COMPANIES</div>
    </div>
    <div class="stats">
        <div class="stat-item"><div class="label">👑 Emperor</div><div class="value">Derek</div></div>
        <div class="stat-item"><div class="label">📊 Revenue</div><div class="value">$0</div></div>
        <div class="stat-item"><div class="label">⚖️ Litigation</div><div class="value red">3</div></div>
        <div class="stat-item"><div class="label">🛡️ Security</div><div class="value green">Level 1</div></div>
    </div>
    <div class="bottom">
        <div class="chat-box">
            <div class="msg"><span class="sender soul">🏛️ SoulStack</span> Welcome, Emperor. 3D holographic interface active.</div>
            <div class="msg"><span class="sender primedox">🧠 PrimeDox</span> 31 documents loaded. Legal research ready.</div>
            <div class="msg"><span class="sender omni">🛡️ OmniAGuard</span> Threat level: GREEN. 14 agents active.</div>
        </div>
        <div class="avatar-badge">
            <div class="av">🧠</div>
            <div class="av">🛡️</div>
            <div class="av">🔬</div>
            <div class="av">🏛️</div>
        </div>
    </div>
</div>
<script>
const container=document.getElementById('canvas');
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x050510);
const camera=new THREE.PerspectiveCamera(45,window.innerWidth/window.innerHeight,0.1,1000);
camera.position.set(0,2,8);
camera.lookAt(0,0,0);
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});
renderer.setSize(window.innerWidth,window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
container.appendChild(renderer.domElement);
const ambient=new THREE.AmbientLight(0x222244,0.5);
scene.add(ambient);
const dirLight=new THREE.DirectionalLight(0xd4af37,1);
dirLight.position.set(5,10,5);
scene.add(dirLight);
const grid=new THREE.GridHelper(10,20,0xd4af37,0x50C878);
grid.position.y=-1;
scene.add(grid);
const towerGroup=new THREE.Group();
const towerGeo=new THREE.BoxGeometry(0.8,3,0.8);
const towerMat=new THREE.MeshPhysicalMaterial({color:0xd4af37,transparent:true,opacity:0.15,metalness:0.9,roughness:0.1,emissive:0xd4af37,emissiveIntensity:0.05});
const tower=new THREE.Mesh(towerGeo,towerMat);
tower.position.y=0.5;
towerGroup.add(tower);
const wireframeMat=new THREE.MeshBasicMaterial({color:0x50C878,wireframe:true,transparent:true,opacity:0.3});
const wireframe=new THREE.Mesh(towerGeo.clone(),wireframeMat);
wireframe.position.y=0.5;
towerGroup.add(wireframe);
for(let i=0;i<20;i++){const floor=new THREE.Mesh(new THREE.BoxGeometry(0.9,0.05,0.9),new THREE.MeshPhysicalMaterial({color:i%2===0?0xd4af37:0x50C878,emissive:i%2===0?0xd4af37:0x50C878,emissiveIntensity:0.2,transparent:true,opacity:0.4}));floor.position.y=i*0.15;towerGroup.add(floor)}
const ringGeo=new THREE.TorusGeometry(1.2,0.02,16,60);
const ringMat=new THREE.MeshPhysicalMaterial({color:0xd4af37,emissive:0xd4af37,emissiveIntensity:0.3,transparent:true,opacity:0.3});
const ring=new THREE.Mesh(ringGeo,ringMat);
ring.rotation.x=Math.PI/2;
ring.position.y=0.2;
towerGroup.add(ring);
const ring2=ring.clone();
ring2.scale.set(1.4,1.4,1.4);
ring2.material=ringMat.clone();
ring2.material.opacity=0.15;
towerGroup.add(ring2);
scene.add(towerGroup);
const particlesGeo=new THREE.BufferGeometry();
const positions=new Float32Array(500*3);
for(let i=0;i<500*3;i++)positions[i]=(Math.random()-0.5)*15;
particlesGeo.setAttribute('position',new THREE.BufferAttribute(positions,3));
const particlesMat=new THREE.PointsMaterial({color:0xd4af37,size:0.04,transparent:true,opacity:0.6,blending:THREE.AdditiveBlending});
const particles=new THREE.Points(particlesGeo,particlesMat);
scene.add(particles);
const sphereGeo=new THREE.SphereGeometry(0.4,32,32);
const sphereMat=new THREE.MeshPhysicalMaterial({color:0x00d4ff,emissive:0x00d4ff,emissiveIntensity:0.1,transparent:true,opacity:0.2,wireframe:true});
const sphere=new THREE.Mesh(sphereGeo,sphereMat);
sphere.position.set(2,1.5,-2);
scene.add(sphere);
let mouseX=0,mouseY=0;
document.addEventListener('mousemove',(e)=>{mouseX=(e.clientX/window.innerWidth)*2-1;mouseY=-(e.clientY/window.innerHeight)*2+1});
window.addEventListener('resize',()=>{const w=window.innerWidth,h=window.innerHeight;camera.aspect=w/h;camera.updateProjectionMatrix();renderer.setSize(w,h)});
function animate(){requestAnimationFrame(animate);towerGroup.rotation.y+=0.003;particles.rotation.y+=0.0005;particles.rotation.x+=0.0002;sphere.rotation.x+=0.01;sphere.rotation.y+=0.02;towerGroup.rotation.x+=(mouseY*0.1-towerGroup.rotation.x)*0.01;towerGroup.rotation.z+=(-mouseX*0.1-towerGroup.rotation.z)*0.01;renderer.render(scene,camera)}
animate();
</script>
</body>
</html>
