<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>🏛️ Francisco Holdings Inc.</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#050510;color:#e5e4e2;font-family:'Segoe UI',sans-serif;overflow:hidden;height:100vh}
canvas{position:fixed;top:0;left:0;z-index:0}
.content{position:relative;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;text-align:center;padding:2rem}
h1{font-size:4rem;font-weight:900;letter-spacing:12px;background:linear-gradient(135deg,#D4AF37,#50C878);-webkit-background-clip:text;-webkit-text-fill-color:transparent;text-shadow:0 0 80px rgba(212,175,55,0.1)}
.sub{color:#8892b0;font-size:1.2rem;letter-spacing:6px;margin-top:0.5rem}
.tagline{color:#606080;font-size:0.9rem;letter-spacing:4px;margin-top:2rem;max-width:600px}
.btn-group{display:flex;gap:1rem;margin-top:3rem;flex-wrap:wrap;justify-content:center}
.btn{display:inline-block;padding:0.8rem 2.5rem;border-radius:100px;font-weight:700;letter-spacing:2px;text-decoration:none;transition:0.3s;border:none;cursor:pointer}
.btn-gold{background:linear-gradient(135deg,#D4AF37,#50C878);color:#0a0a0f}
.btn-gold:hover{transform:translateY(-3px);box-shadow:0 10px 40px rgba(212,175,55,0.3)}
.btn-outline{background:transparent;border:1px solid rgba(212,175,55,0.3);color:#D4AF37}
.btn-outline:hover{background:rgba(212,175,55,0.1)}
.footer{position:fixed;bottom:1rem;width:100%;text-align:center;color:#404060;font-size:0.7rem;letter-spacing:2px;z-index:10}
</style>
</head>
<body>
<canvas id="bg"></canvas>
<div class="content">
<h1>🏛️ FRANCISCO HOLDINGS</h1>
<p class="sub">PRIVATE — EMPEROR ONLY</p>
<p class="tagline">The world's most advanced digital empire enterprise &amp; AI business automation conglomerate.</p>
<div class="btn-group">
<a href="/dashboard.html" class="btn btn-gold">🔐 Enter Command Center</a>
<a href="/tenants" class="btn btn-outline">🏢 Empire Tower</a>
</div>
</div>
<div class="footer">© 2026 — Private. All rights reserved.</div>
<script>
const c=document.getElementById('bg'),x=c.getContext('2d');let w,h,s=[];
function resize(){w=c.width=innerWidth;h=c.height=innerHeight}
window.addEventListener('resize',resize);resize();
for(let i=0;i<200;i++)s.push({x:Math.random()*w,y:Math.random()*h,r:Math.random()*2+0.5,d:Math.random()*Math.PI*2,s:Math.random()*0.5+0.1});
function draw(){x.fillStyle='rgba(5,5,16,0.15)';x.fillRect(0,0,w,h);s.forEach(p=>{p.x+=Math.cos(p.d)*p.s;p.y+=Math.sin(p.d)*p.s;if(p.x<0||p.x>w)p.d=Math.PI-p.d;if(p.y<0||p.y>h)p.d=-p.d;x.beginPath();x.arc(p.x,p.y,p.r,0,Math.PI*2);x.fillStyle='rgba(212,175,55,0.3)';x.fill()});requestAnimationFrame(draw)}
draw();
</script>
</body>
</html>
