<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dream Core — AI Website Generator</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{background:#050510;color:#e5e4e2;font-family:'Segoe UI',sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;text-align:center;padding:2rem}
        h1{font-size:3rem;background:linear-gradient(135deg,#D4AF37,#50C878,#00d4ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:0.5rem}
        .sub{color:#8892b0;margin-bottom:2rem;font-size:1.2rem}
        .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:1.5rem;max-width:1000px;width:100%;margin:0 auto}
        .card{background:rgba(17,34,64,0.3);border:1px solid rgba(212,175,55,0.06);border-radius:16px;padding:1.5rem;transition:0.3s}
        .card:hover{border-color:#D4AF37;transform:translateY(-4px)}
        .card .icon{font-size:2.5rem;margin-bottom:0.5rem}
        .card h3{color:#D4AF37;margin-bottom:0.5rem}
        .card p{color:#8892b0;font-size:0.9rem}
        .btn{display:inline-block;padding:0.8rem 2rem;background:linear-gradient(135deg,#D4AF37,#50C878);color:#0a0a0f;text-decoration:none;border-radius:100px;font-weight:700;border:none;cursor:pointer;transition:0.3s}
        .btn:hover{transform:translateY(-3px)}
        .footer{text-align:center;padding:2rem;color:#404060;font-size:0.7rem;border-top:1px solid rgba(212,175,55,0.05);margin-top:2rem}
    </style>
</head>
<body>
    <h1>🌀 Dream Core</h1>
    <p class="sub">Generate an AI website for any niche in 1-2 minutes.</p>
    <div class="grid">
        <div class="card"><div class="icon">🏥</div><h3>Healthcare</h3><p>AI-powered healthcare website</p><button class="btn" onclick="alert('🚀 Dream Core: Generating healthcare website...')">Generate</button></div>
        <div class="card"><div class="icon">💰</div><h3>FinTech</h3><p>AI-powered fintech website</p><button class="btn" onclick="alert('🚀 Dream Core: Generating fintech website...')">Generate</button></div>
        <div class="card"><div class="icon">📚</div><h3>EdTech</h3><p>AI-powered education website</p><button class="btn" onclick="alert('🚀 Dream Core: Generating edtech website...')">Generate</button></div>
        <div class="card"><div class="icon">🌱</div><h3>Green Energy</h3><p>AI-powered clean energy website</p><button class="btn" onclick="alert('🚀 Dream Core: Generating green energy website...')">Generate</button></div>
    </div>
    <div class="footer">© 2026 <span style="color:#D4AF37;">Phoenix Dominion</span> — Francisco Holdings Inc.</div>
</body>
</html>
